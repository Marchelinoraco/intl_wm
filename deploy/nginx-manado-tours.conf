# =============================================================================
# manado.tours — TAHAP COMING SOON
# =============================================================================
# Menyajikan SATU halaman untuk semua path. Tidak ada dead end: /en/tours pun
# menampilkan halaman coming soon, bukan 404.
#
# Saat situs sungguhan terbit nanti, ganti blok `location /` dengan versi
# di bagian bawah berkas ini.
#
# Pasang di: /etc/nginx/sites-available/manado.tours
# Aktifkan  : ln -s /etc/nginx/sites-available/manado.tours /etc/nginx/sites-enabled/
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name manado.tours www.manado.tours;

    # Certbot akan menambahkan blok pengalihan HTTPS sendiri di sini.
    root /var/www/manado.tours;
    index index.html;

    location / {
        # Tahap coming soon: apa pun path-nya, sajikan halaman yang sama.
        try_files $uri /index.html;
    }

    location = /robots.txt {
        try_files $uri =404;
        access_log off;
    }

    # Aset statis boleh di-cache lama; HTML jangan, supaya pergantian ke situs
    # sungguhan langsung terlihat tanpa menunggu cache pengunjung kedaluwarsa.
    location ~* \.(png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
    gzip_min_length 512;
}

# =============================================================================
# NANTI — saat situs Next.js sungguhan terbit, ganti `location /` di atas
# dengan yang ini. Static export menghasilkan `en/tours/index.html`, bukan satu
# index.html seperti SPA, jadi butuh rantai try_files yang berbeda:
#
#   location / {
#       try_files $uri $uri/ $uri.html /404.html;
#   }
#
# Dan tambahkan deteksi bahasa di root. Contoh, dengan `map` di level http:
#
#   map $http_accept_language $intl_lang {
#       default        en;
#       ~*^ko          ko;
#       ~*^zh          zh;
#   }
#
#   location = / {
#       return 302 /$intl_lang/;
#   }
#
# 302 dan bukan 301 — anjuran Google agar pengalihan berbasis bahasa tidak
# di-cache permanen oleh peramban.
# =============================================================================
